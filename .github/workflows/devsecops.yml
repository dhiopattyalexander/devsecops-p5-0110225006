name: DevSecOps Multi-Tool SAST Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Unit Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Unit Tests with Coverage
        run: |
          pytest -v --cov=src --cov-report=xml:coverage.xml tests/

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarqube-scan:
    name: "Tugas 1: SonarQube / SonarCloud SAST Analysis"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Test Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube / SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

  semgrep-scan:
    name: "Tugas 3: Custom Semgrep Rules for Flask"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep with Custom Flask Rules
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          mkdir -p reports
          echo "=== RUNNING SEMGREP SCAN WITH CUSTOM RULES ==="
          semgrep scan --config=.semgrep/custom-rules.yml --config=auto --sarif --output=reports/semgrep-results.sarif || true
          semgrep scan --config=.semgrep/custom-rules.yml --config=auto --text || true

      - name: Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/semgrep-results.sarif

      - name: Upload Semgrep Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: reports/

  bandit-scan:
    name: Python Bandit SAST & Quality Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Bandit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit SAST Scanner
        run: |
          mkdir -p reports
          bandit -r src/ -f json -o reports/bandit-report.json || true
          bandit -r src/ -f txt -o reports/bandit-report.txt || true
          cat reports/bandit-report.txt

      - name: Enforce DevSecOps Quality Gate
        run: |
          python scripts/quality_gate.py reports/bandit-report.json
